version: '3'

# https://taskfile.dev

vars:
  # Modules to check with clang-format/clang-tidy;
  MODULES: atk,font,g3d,ui2d,vfx
  _MODULES1: ',{{.MODULES}}'
  _MODULES2: '^{{.MODULES}}$'
  SOURCES: '{{._MODULES1 | replace "," " lib/"}}'
  CLANG_TIDY_LIBS: '{{.MODULES | replace " " "" | replace "," "|" }}'

tasks:
  clone-deps:
    desc: Clone dependencies for development
    cmds:
      - rm -rf lib/nnsdk
      - git clone https://github.com/open-ead/nnsdk lib/nnsdk
    
  pr:
    desc: Run everything the PR checks
    cmds:
      - task: configure
      - task: build
      - task: check

  configure:
    desc: Configure CMake
    cmds:
      - task: cmake
        vars:
          CMAKE_ARGS: -DNNSDK_DIR=$(pwd)/lib/nnsdk
      - >
        cmake -G Ninja -B test/header_check/build -S test/header_check
        -DNN_SDK=1.2.3 
        -DNN_WARE=4.5.6 
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DCMAKE_CXX_STANDARD=17
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_FLAGS='-D__aarch64__'
        -DCMAKE_CXX_FLAGS='-D__aarch64__'
        -DNNSDK_DIR=$(pwd)/lib/nnsdk
  cmake:
    cmds:
      - >
        cmake -G Ninja -B build -S .
        -DNN_SDK=1.2.3 
        -DNN_WARE=4.5.6 
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DCMAKE_CXX_STANDARD=17
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_FLAGS='-D__aarch64__'
        -DCMAKE_CXX_FLAGS='-D__aarch64__'
        {{.CMAKE_ARGS}}
        {{.CLI_ARGS}}
      

  build:
    desc: Check the project builds
    vars:
      VERIFY_TARGETS: '{{._MODULES2 | replace " " "" | replace "," "$ ^" | replace "^" "--target nn_" | replace "$" "_verify_interface_header_sets"}}'
    cmds:
      # the header check test already builds all the libs so we don't need an extra --build build here
      - cmake --build build {{.VERIFY_TARGETS}}
      - cmake --build test/header_check/build

  check:
    desc: Run clang-format and clang-tidy checks
    cmds:
      # print versions in CI so it's 'Works On My Machine' is debugable
      - silent: true
        cmd: |
          if [ -n "$CI" ]; then
            clang-format --version
            clang-tidy --version
          fi
      - task: clang-format
        vars: { ARGS: -n -Werror }
      - task: clang-tidy
  fix:
    desc: Run clang-format to format the code
    cmds:
      - task: clang-format
        vars: { ARGS: -i }

  clean:
    desc: Remove CMake build files
    cmds:
      - rm -rf build
      - rm -rf test/*/build

  clang-format:
    cmds:
      - silent: true
        cmd: > 
          echo 'running clang-format with {{numCPU}} cpus with args: {{.ARGS}}';
          find {{.SOURCES}}
          -regextype posix-extended
          -regex '.*\.[ch](\+\+|pp|xx|c|h)?'
          | xargs -P {{numCPU}} -n 1 clang-format {{.ARGS}}
  clang-tidy:
    vars:
      CMD: clang-tidy --warnings-as-errors="*" --header-filter="include/nn/({{.CLANG_TIDY_LIBS}})" -p build --quiet
    cmds:
      - silent: true
        cmd: |
          echo 'running clang-tidy with {{numCPU}} cpus';
          find {{.SOURCES}} -regextype posix-extended -regex '.*\.[ch](\+\+|pp|xx|c|h)?' | xargs -P {{numCPU}} -n 1 sh -c 'printf "\r\033[Kclang-tidy: $1"; {{.CMD}} "$1"' _;
          echo ''
